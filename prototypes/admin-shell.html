<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexo · Prototipo de navegación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b1014;
      --ink-2: #141c24;
      --ink-3: #1c2732;
      --line: rgba(255,255,255,.08);
      --muted: #8a9aab;
      --text: #eef3f6;
      --teal: #12b8a8;
      --teal-dim: rgba(18,184,168,.16);
      --sage: #c9d7d0;
      --sage-deep: #b7c9c0;
      --paper: #f4f8f6;
      --row-a: #e7f1eb;
      --row-b: #f7fbf8;
      --row-h: #d4ece0;
      --filter: #243832;
      --paid: #64748b;
      --pending: #e8590c;
      --partial: #c49214;
      --overdue: #dc3d3d;
      --ok: #1a7f5a;
      --sidebar: 268px;
      --top: 58px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      background: var(--ink);
      color: var(--text);
      overflow: hidden;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; border: 0; background: none; color: inherit; }

    .topbar {
      height: var(--top);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px 0 16px;
      background: var(--ink);
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 132px;
      padding-right: 8px;
    }
    .brand-mark {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--teal);
      color: var(--ink);
      display: grid; place-items: center;
      font-weight: 700; font-size: 15px;
      letter-spacing: -.04em;
    }
    .brand strong { font-size: 15px; letter-spacing: .02em; display: block; line-height: 1.1; }
    .brand span { font-size: 10px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }

    .modules {
      display: flex;
      align-items: stretch;
      gap: 2px;
      flex: 1;
      overflow-x: auto;
      height: 100%;
      scrollbar-width: none;
    }
    .modules::-webkit-scrollbar { display: none; }
    .mod {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 76px;
      padding: 6px 12px 8px;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: color .15s, background .15s, border-color .15s;
      white-space: nowrap;
    }
    .mod:hover { color: var(--text); background: rgba(255,255,255,.04); }
    .mod.on {
      color: var(--text);
      border-bottom-color: var(--teal);
      background: linear-gradient(180deg, transparent, rgba(18,184,168,.08));
    }
    .mod svg { width: 18px; height: 18px; }
    .mod em { font-style: normal; font-size: 11px; font-weight: 500; letter-spacing: .02em; }

    .utils { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .search {
      display: flex; align-items: center; gap: 8px;
      background: var(--ink-3);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--muted);
      min-width: 200px;
    }
    .search input {
      background: none; border: 0; outline: none; color: var(--text);
      width: 160px; font-size: 13px;
    }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 8px;
      display: grid; place-items: center; color: var(--muted);
    }
    .icon-btn:hover { background: var(--ink-3); color: var(--text); }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #2a4a55; color: var(--teal);
      display: grid; place-items: center;
      font-size: 12px; font-weight: 600;
      border: 1px solid var(--line);
    }

    .shell {
      height: calc(100% - var(--top));
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
    }
    .shell.aside-off { grid-template-columns: 0px 1fr; }
    .shell.aside-off .aside { transform: translateX(-100%); opacity: 0; pointer-events: none; }

    .workspace {
      background: var(--sage);
      overflow: auto;
      padding: 18px 20px 28px;
    }

    .crumb {
      display: flex; align-items: center; gap: 8px;
      color: #3d5349; font-size: 12px; font-weight: 500;
      margin-bottom: 12px;
    }
    .crumb b { color: #1c2b24; }
    .crumb i { font-style: normal; opacity: .5; }

    .panel {
      background: var(--paper);
      border-radius: 12px;
      border: 1px solid rgba(28,43,36,.08);
      overflow: hidden;
      animation: rise .28s ease;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .head {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: #eef4f0;
      border-bottom: 1px solid rgba(28,43,36,.08);
    }
    .head h1 {
      font-size: 18px; font-weight: 600; color: #14201b;
      letter-spacing: -.02em;
    }
    .count {
      font-size: 13px; color: #5b7268; font-weight: 500;
      background: #dce8e1; padding: 2px 8px; border-radius: 999px;
    }
    .head .grow { flex: 1; }
    .page-size {
      font-size: 12px; color: #4a5f56;
      display: flex; align-items: center; gap: 6px;
    }
    .page-size select {
      border: 1px solid #c5d4cc; background: #fff; border-radius: 6px;
      padding: 4px 8px; color: #14201b;
    }
    .plus {
      width: 38px; height: 38px; border-radius: 8px;
      background: #fff; color: #111;
      display: grid; place-items: center;
      border: 1px solid #cfdad4;
      transition: transform .12s, background .12s;
    }
    .plus:hover { background: var(--teal); color: #06221f; transform: scale(1.04); }

    .filters {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 12px;
      background: var(--filter);
      color: #d5e4dc;
    }
    .filters select, .filters input {
      background: #1b2c27; color: #e8f2ec;
      border: 1px solid #355248; border-radius: 6px;
      padding: 6px 8px; font-size: 12px; min-width: 110px;
    }
    .filters input { min-width: 140px; }
    .go {
      width: 32px; height: 32px; border-radius: 6px;
      background: var(--teal); color: #06221f;
      display: grid; place-items: center;
    }

    table.data {
      width: 100%;
      border-collapse: collapse;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 13px;
      color: #1a2a24;
    }
    table.data th {
      text-align: left; font-weight: 600; font-size: 11px;
      letter-spacing: .06em; text-transform: uppercase;
      color: #5c7368; padding: 10px 12px;
      background: #e4eee8; border-bottom: 1px solid #d0ddd6;
    }
    table.data td {
      padding: 9px 12px;
      border-bottom: 1px solid #dce8e2;
      white-space: nowrap;
    }
    table.data tbody tr:nth-child(odd) { background: var(--row-a); }
    table.data tbody tr:nth-child(even) { background: var(--row-b); }
    table.data tbody tr { cursor: pointer; transition: background .12s; }
    table.data tbody tr:hover { background: var(--row-h); }
    .ref { color: #0f766e; font-weight: 600; }
    .money { font-variant-numeric: tabular-nums; font-weight: 500; }
    .right { text-align: right; }

    .pill {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; letter-spacing: .02em;
    }
    .pill.paid { background: #cfd6d8; color: #334155; }
    .pill.pending { background: #fdba74; color: #7c2d12; }
    .pill.partial { background: #fde68a; color: #713f12; }
    .pill.overdue { background: #fecaca; color: #7f1d1d; }
    .pill.ok { background: #bbf7d0; color: #14532d; }
    .pill.draft { background: #e2e8f0; color: #334155; }
    .pill.warn { background: #fed7aa; color: #9a3412; }

    .check { accent-color: #0f766e; }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }
    .kpi {
      background: var(--paper);
      border-radius: 12px;
      padding: 16px 18px;
      border: 1px solid rgba(28,43,36,.08);
      animation: rise .3s ease;
    }
    .kpi s { display: block; font-size: 12px; color: #5b7268; text-decoration: none; font-weight: 500; margin-bottom: 6px; }
    .kpi b { display: block; font-size: 26px; letter-spacing: -.03em; color: #14201b; font-weight: 650; }
    .kpi em { font-style: normal; font-size: 12px; color: #3d7a62; }

    .grid-2 { display: grid; grid-template-columns: 1.4fr .8fr; gap: 12px; }
    .card-title {
      font-size: 14px; font-weight: 600; color: #14201b;
      padding: 14px 16px 0;
    }

    .ficha {
      display: grid; grid-template-columns: 280px 1fr; gap: 0;
      min-height: 520px;
    }
    .ficha-side {
      background: #eaf2ed; padding: 22px;
      border-right: 1px solid #d5e2db;
    }
    .photo {
      width: 96px; height: 96px; border-radius: 16px;
      background: #9ab5aa; color: #fff;
      display: grid; place-items: center;
      font-size: 32px; font-weight: 600;
      margin-bottom: 14px;
    }
    .ficha-side h2 { color: #14201b; font-size: 20px; letter-spacing: -.03em; }
    .ficha-side p { color: #4a5f56; font-size: 13px; margin-top: 4px; }
    .meta { margin-top: 16px; display: grid; gap: 8px; }
    .meta div { font-size: 13px; color: #2c3d36; }
    .meta span { display: block; font-size: 11px; color: #6b8076; text-transform: uppercase; letter-spacing: .06em; }
    .ficha-main { padding: 20px 22px; background: var(--paper); }
    .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 20px; }
    .stats3 div {
      background: #eef5f1; border-radius: 10px; padding: 12px;
    }
    .stats3 span { font-size: 11px; color: #5b7268; text-transform: uppercase; letter-spacing: .06em; }
    .stats3 b { display: block; margin-top: 4px; color: #14201b; font-size: 18px; }

    .loan-line {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid #e3ece7;
      cursor: pointer;
    }
    .loan-line:hover { color: #0f766e; }

    .form {
      padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px;
    }
    .form label { display: grid; gap: 6px; font-size: 12px; color: #4a5f56; font-weight: 500; }
    .form input, .form select, .form textarea {
      border: 1px solid #c9d7d0; border-radius: 8px; padding: 9px 10px;
      background: #fff; color: #14201b;
    }
    .form .full { grid-column: 1 / -1; }
    .form-actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; padding-top: 8px; }
    .btn {
      padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 13px;
    }
    .btn.primary { background: #0f766e; color: #fff; }
    .btn.ghost { background: #e7eeea; color: #1c2b24; }

    .timeline { padding: 8px 16px 20px; }
    .ev {
      display: grid; grid-template-columns: 88px 1fr auto;
      gap: 12px; padding: 10px 0; border-bottom: 1px solid #e3ece7;
      font-size: 13px; color: #1a2a24;
    }
    .ev time { color: #5b7268; font-variant-numeric: tabular-nums; }

    .aside {
      background: var(--ink-2);
      border-right: 1px solid var(--line);
      overflow: auto;
      transition: transform .22s ease, opacity .22s ease;
    }
    .aside-h {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px;
      color: var(--muted); font-size: 11px; letter-spacing: .14em;
      text-transform: uppercase;
    }
    .group { padding: 10px 10px 14px; }
    .group:first-child { padding-top: 14px; }
    .group h3 {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600; color: var(--text);
      padding: 8px 8px;
    }
    .group h3 svg { width: 16px; height: 16px; color: var(--teal); }
    .item {
      display: flex; align-items: center; gap: 8px;
      width: 100%; text-align: left;
      padding: 7px 12px 7px 28px;
      border-radius: 6px;
      color: #b7c4ce; font-size: 13px;
      position: relative;
    }
    .item:hover { background: rgba(255,255,255,.04); color: var(--text); }
    .item.on {
      background: var(--teal-dim); color: var(--text);
    }
    .item.on::before {
      content: "";
      position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px;
      border-radius: 0 3px 3px 0; background: var(--teal);
    }
    .item .dot {
      width: 5px; height: 5px; border-radius: 50%; background: #4a5d6c;
    }
    .item.on .dot { background: var(--teal); }
    .badge {
      margin-left: auto; font-size: 10px; font-weight: 600;
      background: #24303a; color: #9fb0be;
      padding: 1px 6px; border-radius: 999px;
    }

    .toast {
      position: fixed; bottom: 18px; left: 20px;
      background: #14201b; color: #e8f2ec;
      padding: 10px 14px; border-radius: 8px; font-size: 12px;
      border: 1px solid #2d4a42; display: none; z-index: 40;
    }

    .proto {
      position: fixed; bottom: 16px; left: calc(var(--sidebar) + 16px);
      font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      color: #3d5349; background: rgba(244,248,246,.85);
      padding: 6px 10px; border-radius: 999px; z-index: 30;
      border: 1px solid rgba(28,43,36,.12);
    }
    .shell.aside-off .proto { left: 16px; }

    @media (max-width: 1100px) {
      .kpis, .grid-2, .ficha { grid-template-columns: 1fr; }
      .search { display: none; }
      :root { --sidebar: 230px; }
    }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      .aside {
        position: fixed; top: var(--top); left: 0; bottom: 0; width: 260px; z-index: 25;
      }
      .proto { left: 16px; }
    }
    html, body, button, input, select, textarea,
    .mod em, .item, .group h3, .aside-h, table.data, table.data th, table.data td,
    .pill, .head h1, .crumb, .filters select, .filters input, .btn, .badge {
      font-size: 15px !important;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div>
        <strong>Nexo</strong>
        <span>Cartera</span>
      </div>
    </div>
    <nav class="modules" id="modules"></nav>
    <div class="utils">
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input placeholder="Cliente, cédula, préstamo…" />
      </label>
      <button class="icon-btn" id="toggleAside" title="Mostrar u ocultar variantes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
      <div class="avatar">AM</div>
    </div>
  </header>

  <div class="shell" id="shell">
    <aside class="aside" id="aside"></aside>
    <main class="workspace" id="workspace"></main>
  </div>
  <div class="proto">Prototipo de navegación · sin backend</div>
  <div class="toast" id="toast">Vista de demostración. Los datos no se guardan.</div>

  <script>
    const ICONS = {
      home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5z"/></svg>',
      users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7.5" r="3.5"/><path d="M22 21v-2a3.5 3.5 0 0 0-2.5-3.35"/><path d="M16.5 4.15a3.5 3.5 0 0 1 0 6.7"/></svg>',
      file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg>',
      wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14" r="1.2"/></svg>',
      cash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.4"/><path d="M6 12h.01M18 12h.01"/></svg>',
      map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4 3 7v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg>',
      bike: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6.5" cy="16.5" r="3"/><circle cx="17.5" cy="16.5" r="3"/><path d="M6.5 16.5 10 8h4l3.5 8.5M10 8l2 4h5"/></svg>',
      chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16M7 16V9M12 16V5M17 16v-6"/></svg>',
      gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
      folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'
    };

    const MODULES = [
      { id: "inicio", label: "Inicio", icon: "home", groups: [
        { title: "Panel", items: [
          { id: "resumen", label: "Resumen" },
          { id: "alertas", label: "Alertas", badge: "4" },
          { id: "hoy", label: "Operación de hoy" }
        ]}
      ]},
      { id: "clientes", label: "Clientes", icon: "users", groups: [
        { title: "Clientes", items: [
          { id: "nuevo", label: "Nuevo cliente" },
          { id: "listado", label: "Listado" },
          { id: "prospectos", label: "Prospectos", badge: "12" },
          { id: "revision", label: "Pte. revisión", badge: "5" },
          { id: "activos", label: "Activos" },
          { id: "inactivos", label: "Inactivos" }
        ]},
        { title: "Expediente", items: [
          { id: "ficha", label: "Ficha" },
          { id: "historial", label: "Historial" },
          { id: "evidencias", label: "Evidencias" }
        ]}
      ]},
      { id: "prestamos", label: "Préstamos", icon: "file", groups: [
        { title: "Préstamos", items: [
          { id: "nuevo", label: "Nuevo préstamo" },
          { id: "listado", label: "Listado" },
          { id: "activos", label: "Activos" },
          { id: "finalizados", label: "Finalizados" }
        ]},
        { title: "Consulta", items: [
          { id: "cuenta", label: "Estado de cuenta" },
          { id: "cuotas", label: "Cuotas" }
        ]}
      ]},
      { id: "cartera", label: "Cartera", icon: "wallet", groups: [
        { title: "Cartera", items: [
          { id: "resumen", label: "Resumen" },
          { id: "mora", label: "Mora" },
          { id: "cobrador", label: "Por cobrador" },
          { id: "ruta", label: "Por ruta" }
        ]}
      ]},
      { id: "cobranza", label: "Cobranza", icon: "cash", groups: [
        { title: "Cobranza", items: [

      { id: "cobradores", label: "Cobradores", icon: "bike", groups: [

      { id: "sistema", label: "Sistema", icon: "gear", groups: [
        { title: "Acceso", items: [
          { id: "usuarios", label: "Usuarios" },
          { id: "roles", label: "Roles" },
          { id: "permisos", label: "Permisos" }

        { title: "Control", items: [
          { id: "auditoria", label: "Auditoría" },
          { id: "config", label: "Configuración" }
        ]}
      ]}
    ];

    const DEFAULT_VIEW = {
      inicio: "resumen",
      clientes: "listado",
      prestamos: "listado",
      cartera: "resumen",
      cobranza: "hoy",
      rutas: "listado",
      cobradores: "listado",

      sistema: "usuarios"

    let state = { module: "clientes", view: "listado" };

    const money = n => "$ " + Number(n).toLocaleString("es-CO");

    const CLIENTS = [
      ["CL-24081", "27/08/2026", "Carlos Pérez", "Carlitos", "Soacha", 600000, 350000, "Pagada", "paid"],
      ["CL-24082", "27/08/2026", "María Gómez", "Mari", "Bosa", 450000, 120000, "Pte. pago", "pending"],
      ["CL-24083", "26/08/2026", "Pedro Rodríguez", "Pacho", "Kennedy", 800000, 0, "Pagada", "paid"],
      ["CL-24084", "26/08/2026", "Ana López", "Anita", "Suba", 300000, 150000, "Pago parcial", "partial"],
      ["CL-24085", "25/08/2026", "Julián Castro", "", "Engativá", 500000, 500000, "Vencida", "overdue"],
      ["CL-24086", "25/08/2026", "Laura Méndez", "Lau", "Usaquén", 250000, 0, "Pagada", "paid"],
      ["CL-24087", "24/08/2026", "Andrés Gil", "", "Fontibón", 700000, 210000, "Pago parcial", "partial"],
      ["CL-24088", "24/08/2026", "Diana Ruiz", "Di", "Chapinero", 180000, 180000, "Pte. pago", "pending"]
    ];

    const LOANS = [
      ["P-000458", "Carlos Pérez", "27/02/2026", 500000, 350000, "Activo", "ok"],
      ["P-000459", "María Gómez", "12/03/2026", 450000, 120000, "Activo", "pending"],
      ["P-000460", "Pedro Rodríguez", "04/01/2026", 800000, 0, "Finalizado", "paid"],
      ["P-000461", "Ana López", "18/04/2026", 300000, 150000, "Activo", "partial"],
      ["P-000462", "Julián Castro", "02/05/2026", 500000, 500000, "Mora", "overdue"]

    const PAYMENTS = [
      ["PG-9182", "27/08 · 10:35", "Carlos Pérez", "Juan Ríos", 10000, "Pago", "paid"],

    function pill(label, kind) {
      return `<span class="pill ${kind}">${label}</span>`;
    }

    function table(headers, rowsHtml, title, count, createId) {
      return `
        <section class="panel">
          <div class="head">
            <h1>${title}</h1>
            <span class="count">${count}</span>
            <div class="grow"></div>
            <label class="page-size">Ver <select><option>25</option><option>50</option></select></label>
            <button class="plus" data-create="${createId || ""}" title="Crear">${plusSvg()}</button>
          </div>
          <div class="filters">
            <select><option>Todos los cobradores</option><option>Juan Ríos</option><option>Lina Soto</option></select>
            <select><option>Todas las rutas</option><option>Norte</option><option>Sur</option></select>
            <input type="date" value="2026-08-01" />
            <input type="date" value="2026-08-27" />
            <input placeholder="Buscar…" />
            <button class="go">${searchSvg()}</button>
          </div>
          <table class="data">
            <thead><tr>${headers.map(h => `<th${h.right ? ' class="right"' : ""}>${h.t}</th>`).join("")}</tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </section>`;
    }

    function plusSvg() {
      return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>';
    }
    function searchSvg() {
      return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>';
    }

    function clientRows(filter) {
      let rows = CLIENTS;
      if (filter === "prospectos") rows = CLIENTS.slice(0, 3).map(r => { const x = r.slice(); x[7] = "Prospecto"; x[8] = "draft"; return x; });
      if (filter === "revision") rows = CLIENTS.slice(1, 3).map(r => { const x = r.slice(); x[7] = "Pte. revisión"; x[8] = "warn"; return x; });
      if (filter === "activos") rows = CLIENTS.filter(r => r[8] !== "overdue");
      if (filter === "inactivos") rows = CLIENTS.filter(r => r[8] === "overdue");
      return rows.map(r => `
        <tr data-open="ficha">
          <td class="ref">${r[0]}</td>
          <td>${r[1]}</td>
          <td>${r[2]}</td>
          <td>${r[3] || "—"}</td>
          <td>${r[4]}</td>
          <td class="money right">${money(r[5])}</td>
          <td class="money right">${money(r[6])}</td>
          <td>${pill(r[7], r[8])}</td>
          <td><input class="check" type="checkbox" onclick="event.stopPropagation()" /></td>
        </tr>`).join("");
    }

    function viewTitle() {
      const m = MODULES.find(x => x.id === state.module);
      for (const g of m.groups) {
        const it = g.items.find(i => i.id === state.view);
        if (it) return { module: m.label, view: it.label };
      }
      return { module: m.label, view: "" };
    }

    function renderWorkspace() {
      const { module, view } = viewTitle();
      const crumb = `<div class="crumb"><b>${module}</b><i>/</i> ${view}</div>`;
      const key = state.module + ":" + state.view;
      let body = "";

      if (key === "inicio:resumen" || key === "inicio:hoy") {
        body = `
          <div class="kpis">
            <div class="kpi"><s>Clientes activos</s><b>1.284</b><em>+18 esta semana</em></div>
            <div class="kpi"><s>Préstamos vigentes</s><b>936</b><em>Cartera ${money(428900000)}</em></div>
            <div class="kpi"><s>Cobrado hoy</s><b>${money(1840000)}</b><em>142 operaciones</em></div>
            <div class="kpi"><s>Mora</s><b>${money(27650000)}</b><em>61 créditos</em></div>
          </div>
          <div class="grid-2">
            ${table(
              [{t:"Ref"},{t:"Hora"},{t:"Cliente"},{t:"Cobrador"},{t:"Valor", right:true},{t:"Tipo"},{t:"Estado"}],
              PAYMENTS.map(p => `<tr><td class="ref">${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td class="money right">${money(p[4])}</td><td>${p[5]}</td><td>${pill(p[5] === "Pago" ? "Pagada" : "Parcial", p[6])}</td></tr>`).join(""),
              "Movimientos de hoy", PAYMENTS.length, "cobranza:hoy"
            )}
            <section class="panel">
              <div class="card-title">Rutas en campo</div>
              <div class="timeline">
                <div class="ev"><time>Norte</time><div>Juan Ríos · 20 clientes</div>${pill("En curso", "pending")}</div>
                <div class="ev"><time>Sur</time><div>Lina Soto · 18 clientes</div>${pill("En curso", "pending")}</div>
                <div class="ev"><time>Centro</time><div>Diego Mora · 12 clientes</div>${pill("Cerrada", "paid")}</div>
              </div>
            </section>
          </div>`;
      } else if (key === "inicio:alertas") {
        body = `<section class="panel">
          <div class="head"><h1>Alertas</h1><span class="count">4</span></div>
          <div class="timeline">
            <div class="ev"><time>Hoy</time><div>5 prospectos pendientes de revisión</div>${pill("Revisar", "warn")}</div>
            <div class="ev"><time>Hoy</time><div>61 cuotas vencidas sin abono en 7 días</div>${pill("Mora", "overdue")}</div>
            <div class="ev"><time>Ayer</time><div>Pago PG-9102 anulado por el administrador</div>${pill("Auditoría", "draft")}</div>
            <div class="ev"><time>Ayer</time><div>Cobrador sin GPS en 3 cobros</div>${pill("Campo", "partial")}</div>
          </div>
        </section>`;
      } else if (state.module === "clientes" && ["listado","prospectos","revision","activos","inactivos"].includes(state.view)) {
        const titles = { listado: "Clientes", prospectos: "Prospectos", revision: "Pendientes de revisión", activos: "Clientes activos", inactivos: "Clientes inactivos" };
        body = table(
          [{t:"Ref"},{t:"Alta"},{t:"Tercero"},{t:"Apodo"},{t:"Ciudad"},{t:"Total", right:true},{t:"Pendiente", right:true},{t:"Estado"},{t:""}],
          clientRows(state.view),
          titles[state.view],
          state.view === "listado" ? "1.284" : "—",
          "nuevo"
        );
      } else if (key === "clientes:nuevo") {
        body = `<section class="panel">
          <div class="head"><h1>Nuevo cliente</h1></div>
          <form class="form" onsubmit="event.preventDefault(); toast();">
            <label>Nombre completo <input placeholder="Nombre y apellidos" /></label>
            <label>Documento <input placeholder="Cédula" /></label>
            <label>Teléfono <input placeholder="300 000 0000" /></label>
            <label>Correo <input placeholder="opcional" /></label>
            <label class="full">Dirección <input placeholder="Calle, barrio, ciudad" /></label>
            <label class="full">Observaciones <textarea rows="3"></textarea></label>
            <div class="form-actions">
              <button type="button" class="btn ghost">Cancelar</button>
              <button class="btn primary">Guardar para revisión</button>
            </div>
          </form>
        </section>`;
      } else if (key === "clientes:ficha" || key === "clientes:historial" || key === "clientes:evidencias") {
        body = `<section class="panel"><div class="ficha">
          <aside class="ficha-side">
            <div class="photo">CP</div>
            <h2>Carlos Pérez</h2>
            <p>Cliente activo · desde feb 2026</p>
            <div class="meta">
              <div><span>Documento</span> 80.123.456</div>
              <div><span>Teléfono</span> 300 555 0182</div>
              <div><span>Dirección</span> Cra 12 # 8-40, Soacha</div>
              <div><span>Cobrador</span> Juan Ríos · Ruta Norte</div>
            </div>
          </aside>
          <div class="ficha-main">
            <h1 style="font-size:16px;color:#14201b;">Expediente financiero</h1>
            <div class="stats3">
              <div><span>Préstamos activos</span><b>1</b></div>
              <div><span>Saldo</span><b>${money(350000)}</b></div>
              <div><span>Último pago</span><b>27/08 · ${money(10000)}</b></div>
            </div>
            <div class="loan-line" data-goto="prestamos:cuenta"><div class="grow"><b>Préstamo P-000458</b><div style="font-size:12px;color:#5b7268">Cuota ${money(10000)} · 35 pendientes</div></div>${pill("Activo","ok")}</div>
            <div class="card-title" style="padding-left:0">Historial reciente</div>
            <div class="timeline" style="padding-left:0">
              <div class="ev"><time>27/08</time><div>Abono ${money(5000)} · Juan Ríos · GPS · Firma</div>${pill("Parcial","partial")}</div>
              <div class="ev"><time>26/08</time><div>Pago ${money(10000)} · Juan Ríos · GPS · Firma</div>${pill("Pagada","paid")}</div>
              <div class="ev"><time>25/08</time><div>Sin recaudo</div>${pill("Pendiente","pending")}</div>
            </div>
          </div>
        </div></section>`;
      } else if (state.module === "prestamos" && state.view === "cuenta") {
        body = `<section class="panel">
          <div class="head"><h1>Préstamo P-000458</h1>${pill("Activo","ok")}</div>
          <div class="ficha-main">
            <div class="stats3">
              <div><span>Capital</span><b>${money(500000)}</b></div>
              <div><span>Total pactado</span><b>${money(600000)}</b></div>
              <div><span>Saldo</span><b>${money(350000)}</b></div>
            </div>
            <table class="data">
              <thead><tr><th>#</th><th>Fecha</th><th class="right">Valor</th><th class="right">Pagado</th><th>Estado</th></tr></thead>
              <tbody>
                <tr><td>1</td><td>27/02/2026</td><td class="money right">${money(10000)}</td><td class="money right">${money(10000)}</td><td>${pill("Pagada","paid")}</td></tr>
                <tr><td>2</td><td>06/03/2026</td><td class="money right">${money(10000)}</td><td class="money right">${money(10000)}</td><td>${pill("Pagada","paid")}</td></tr>
                <tr><td>3</td><td>13/03/2026</td><td class="money right">${money(10000)}</td><td class="money right">${money(5000)}</td><td>${pill("Parcial","partial")}</td></tr>
                <tr><td>4</td><td>20/03/2026</td><td class="money right">${money(10000)}</td><td class="money right">${money(0)}</td><td>${pill("Pendiente","pending")}</td></tr>
              </tbody>
            </table>
            <p style="margin-top:14px;font-size:12px;color:#5b7268">Los saldos de esta maqueta son ilustrativos. El motor financiero oficial aún no está aprobado.</p>
          </div>
        </section>`;
      } else if (state.module === "prestamos") {
        body = table(
          [{t:"Ref"},{t:"Cliente"},{t:"Desembolso"},{t:"Capital", right:true},{t:"Saldo", right:true},{t:"Estado"}],
          LOANS.map(r => `<tr data-goto="prestamos:cuenta"><td class="ref">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="money right">${money(r[3])}</td><td class="money right">${money(r[4])}</td><td>${pill(r[5], r[6])}</td></tr>`).join(""),
          view, LOANS.length, "nuevo"
        );
      } else if (state.module === "cartera") {
        body = `
          <div class="kpis">
            <div class="kpi"><s>Cartera total</s><b>${money(428900000)}</b><em>936 créditos</em></div>
            <div class="kpi"><s>Al día</s><b>${money(401250000)}</b><em>875</em></div>
            <div class="kpi"><s>En mora</s><b>${money(27650000)}</b><em>61 · regla de mora pendiente</em></div>
            <div class="kpi"><s>Cobrado del mes</s><b>${money(41220000)}</b><em>agosto</em></div>
          </div>
          ${table(
            [{t:"Cliente"},{t:"Préstamo"},{t:"Días"},{t:"Saldo", right:true},{t:"Estado"}],
            `<tr><td>Julián Castro</td><td class="ref">P-000462</td><td>14</td><td class="money right">${money(500000)}</td><td>${pill("Vencida","overdue")}</td></tr>
             <tr><td>María Gómez</td><td class="ref">P-000459</td><td>3</td><td class="money right">${money(120000)}</td><td>${pill("Pte. pago","pending")}</td></tr>`,
            state.view === "mora" ? "Mora" : "Exposición", "61", ""
          )}`;
      } else if (state.module === "cobranza") {
        body = table(
          [{t:"Ref"},{t:"Fecha"},{t:"Cliente"},{t:"Cobrador"},{t:"Valor", right:true},{t:"Tipo"},{t:"Estado"}],
          PAYMENTS.map(p => `<tr><td class="ref">${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td class="money right">${money(p[4])}</td><td>${p[5]}</td><td>${pill(p[5], p[6])}</td></tr>`).join(""),
          view, PAYMENTS.length, ""
        );
      } else if (state.module === "rutas") {
        body = table(
          [{t:"Ruta"},{t:"Fecha"},{t:"Cobrador"},{t:"Clientes"},{t:"Estado"}],
          `<tr><td class="ref">Norte</td><td>27/08/2026</td><td>Juan Ríos</td><td>20</td><td>${pill("En curso","pending")}</td></tr>
           <tr><td class="ref">Sur</td><td>27/08/2026</td><td>Lina Soto</td><td>18</td><td>${pill("En curso","pending")}</td></tr>
           <tr><td class="ref">Centro</td><td>27/08/2026</td><td>Diego Mora</td><td>12</td><td>${pill("Cerrada","paid")}</td></tr>`,
          view, "3", "nueva"
        );
      } else if (state.module === "cobradores") {
        body = table(
          [{t:"Cobrador"},{t:"Zona"},{t:"Ruta hoy"},{t:"Cobrado", right:true},{t:"Estado"}],
          `<tr><td>Juan Ríos</td><td>Norte</td><td>Norte · 20</td><td class="money right">${money(820000)}</td><td>${pill("En campo","ok")}</td></tr>
           <tr><td>Lina Soto</td><td>Sur</td><td>Sur · 18</td><td class="money right">${money(610000)}</td><td>${pill("En campo","ok")}</td></tr>
           <tr><td>Diego Mora</td><td>Centro</td><td>Centro · 12</td><td class="money right">${money(410000)}</td><td>${pill("Cerrada","paid")}</td></tr>`,
          view, "3", "nuevo"
        );
      } else if (state.module === "reportes") {
        body = `<section class="panel">
          <div class="head"><h1>${view}</h1></div>
          <div class="ficha-main">
            <p style="color:#4a5f56;max-width:560px;line-height:1.5">Los reportes se construirán sobre consultas de PostgreSQL, no sobre tablas cargadas en el navegador. Filtros de fecha, cobrador y ruta. Exportación posterior (Excel / PDF).</p>
          </div>
        </section>`;
      } else if (state.module === "sistema") {
        body = `<section class="panel">
          <div class="head"><h1>${view}</h1></div>
          <div class="timeline">
            <div class="ev"><time>10:35</time><div>Juan Ríos registró pago PG-9182 · ${money(10000)} · Carlos Pérez</div>${pill("Pago","paid")}</div>
            <div class="ev"><time>09:12</time><div>Admin aprobó prospecto Ana López → cliente activo</div>${pill("Cliente","ok")}</div>
            <div class="ev"><time>08:40</time><div>Intento de anulación denegado · usuario cobrador</div>${pill("Denegado","overdue")}</div>
          </div>
        </section>`;
      } else {
        body = `<section class="panel"><div class="head"><h1>${view}</h1></div>
          <div class="ficha-main"><p style="color:#4a5f56">Vista de demostración para el módulo ${module}.</p></div></section>`;
      }

      document.getElementById("workspace").innerHTML = crumb + body;
    }

    function renderAside() {
      const m = MODULES.find(x => x.id === state.module);
      document.getElementById("aside").innerHTML = `
        ${m.groups.map(g => `
          <div class="group">
            <h3>${ICONS.folder} ${g.title}</h3>
            ${g.items.map(it => `
              <button class="item ${it.id === state.view ? "on" : ""}" data-view="${it.id}">
                <i class="dot"></i> ${it.label}
                ${it.badge ? `<span class="badge">${it.badge}</span>` : ""}
              </button>`).join("")}
          </div>`).join("")}`;
    }

    function renderModules() {
      document.getElementById("modules").innerHTML = MODULES.map(m => `
        <button class="mod ${m.id === state.module ? "on" : ""}" data-module="${m.id}">
          ${ICONS[m.icon]}<em>${m.label}</em>
        </button>`).join("");
    }

    function go(module, view) {
      state.module = module;
      state.view = view || DEFAULT_VIEW[module];
      renderModules();
      renderAside();
      renderWorkspace();
    }

    function toast() {
      const t = document.getElementById("toast");
      t.style.display = "block";
      clearTimeout(toast._id);
      toast._id = setTimeout(() => t.style.display = "none", 2200);
    }

    document.getElementById("modules").addEventListener("click", e => {
      const b = e.target.closest("[data-module]");
      if (b) go(b.dataset.module);
    });
    document.getElementById("aside").addEventListener("click", e => {
      const b = e.target.closest("[data-view]");
      if (b) go(state.module, b.dataset.view);
    });
    document.getElementById("workspace").addEventListener("click", e => {
      const create = e.target.closest("[data-create]");
      if (create && create.dataset.create) {
        const v = create.dataset.create;
        if (v.includes(":")) { const [m, vw] = v.split(":"); go(m, vw); }
        else go(state.module, v);
        return;
      }
      const open = e.target.closest("[data-open]");
      if (open) { go(state.module, open.dataset.open); return; }
      const gt = e.target.closest("[data-goto]");
      if (gt) { const [m, vw] = gt.dataset.goto.split(":"); go(m, vw); }
    });
    document.getElementById("toggleAside").addEventListener("click", () => {
      document.getElementById("shell").classList.toggle("aside-off");
    });

    go("clientes", "listado");
  </script>
</body>
</html>
